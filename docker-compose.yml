version: '3.8'

services:
  # Local DynamoDB instance for offline testing
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-resume-backend
    ports:
      - "8090:8090"
    environment:
      # Use dummy credentials to satisfy the AWS SDK since we are pointing to a local database
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE=visitor-counter
      - SERVER_PORT=8090
    depends_on:
      - dynamodb-local
      - dynamodb-init

  # Container to initialize the DynamoDB table on startup
  dynamodb-init:
    image: amazon/aws-cli
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
    command: >
      dynamodb create-table
      --endpoint-url http://dynamodb-local:8000
      --table-name visitor-counter
      --attribute-definitions AttributeName=id,AttributeType=S
      --key-schema AttributeName=id,KeyType=HASH
      --billing-mode PAY_PER_REQUEST

  # React Frontend
  frontend:
    image: node:20-alpine
    container_name: cloud-resume-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8090
